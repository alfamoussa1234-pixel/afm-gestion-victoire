const config={joueurs:{sing:'un joueur',fields:[['nom','Nom et prénom','text',true],['categorie','Catégorie','select',true,['U13','U15','U17','U20']],['naissance','Date de naissance','date'],['poste','Poste','text'],['telephone','Téléphone','tel'],['photo','Photo','file'],['note','Observations','text']]},coachs:{sing:'un coach',fields:[['nom','Nom et prénom','text',true],['fonction','Fonction','text'],['telephone','Téléphone','tel'],['photo','Photo','file'],['note','Observations','text']]},dirigeants:{sing:'un dirigeant',fields:[['nom','Nom et prénom','text',true],['fonction','Fonction','text'],['telephone','Téléphone','tel'],['photo','Photo','file'],['note','Observations','text']]},cotisations:{sing:'une cotisation',fields:[['nom','Joueur / référence','text',true],['categorie','Catégorie','select',false,['U13','U15','U17','U20']],['montant','Montant FCFA','number',true],['date','Date','date',true],['note','Observations','text']]},apports:{sing:'un approvisionnement',fields:[['nom','Versé par','text',true],['montant','Montant FCFA','number',true],['date','Date','date',true],['note','Motif','text']]},depenses:{sing:'une dépense',fields:[['nom','Objet de la dépense','text',true],['montant','Montant FCFA','number',true],['date','Date','date',true],['note','Observations','text']]},salaires:{sing:'un salaire',fields:[['nom','Bénéficiaire','text',true],['montant','Montant FCFA','number',true],['date','Date de paiement','date',true],['note','Période / fonction','text']]},primes:{sing:'une prime',fields:[['nom','Bénéficiaire / match','text',true],['montant','Montant FCFA','number',true],['date','Date','date',true],['note','Motif','text']]}};

async function init(){try{let s=await api('status');if(!s.ready){showSetup();return}me=await api('me');await refresh();shell()}catch(e){showLogin()}}
function showLogin(){me=null;$('root').innerHTML=`<div class="loginpage"><form class="loginbox" id="loginform"><img src="/logo-afm.jpg" alt="Logo AFM"><h1>AFM Gestion Victoire</h1><p>Accès privé à l'académie</p><div class="field"><label>Compte</label><select name="username"><option value="president">Président</option><option value="gestionnaire">Gestionnaire</option></select></div><div class="field"><label>Mot de passe</label><input type="password" required name="password" autocomplete="current-password"></div><button class="btn">Se connecter</button><p class="info">Vos données sont conservées sur le serveur sécurisé AFM, pas dans ce navigateur.</p></form></div>`;$('loginform').onsubmit=async e=>{e.preventDefault();try{me=await api('login',Object.fromEntries(new FormData(e.target)));await refresh();shell()}catch(x){toast(x.message)}}}
function showSetup(){$('root').innerHTML=`<div class="loginpage"><form class="loginbox" id="setupform"><img src="/logo-afm.jpg"><h1>Première installation AFM</h1><p>Créez les deux comptes de l'application</p><div class="field"><label>Code d'installation (variable AFM_SETUP_TOKEN de votre hébergement)</label><input name="token" required></div><div class="field"><label>Mot de passe du président (12 caractères minimum)</label><input type="password" name="president" minlength="12" required></div><div class="field"><label>Mot de passe du gestionnaire (12 caractères minimum)</label><input type="password" name="gestionnaire" minlength="12" required></div><button class="btn">Initialiser les comptes</button></form></div>`;$('setupform').onsubmit=async e=>{e.preventDefault();try{await api('setup',Object.fromEntries(new FormData(e.target)));toast('Comptes créés');showLogin()}catch(x){toast(x.message)}}}

function shell(){$('root').innerHTML=`<div class="app"><aside class="side" id="side"><div class="brand"><div class="crest"><img src="/logo-afm.jpg" alt="Logo officiel AFM"></div><div><strong>AFM Gestion Victoire</strong><small>AFRIQUE FOOTBALL MANAGEMENT</small></div></div><input class="search" id="navSearch" placeholder="⌕ Rechercher une rubrique..."><div class="group-title">GESTION DE L'ACADÉMIE</div><div id="nav"></div><div class="sidefooter">Saison 2026–2027 · <b>${esc(me.role)}</b><br>Base de données commune sur ce serveur</div></aside><div class="main"><header class="top"><div style="display:flex;align-items:center;gap:11px"><button class="mobilebar" onclick="toggleMenu()">☰</button><span class="crumb">Afrique Football Management / <span id="crumb">Tableau de bord</span></span></div><div class="topright"><span class="badge">● ${esc(me.username)}</span><button class="btn secondary" onclick="logout()">Déconnexion</button></div></header><main class="content" id="view"></main></div></div>`;$('navSearch').oninput=menu;menu();render()}

function head(title,sub,actions=''){return `<div class="heading"><div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div><div class="actions">${actions}</div></div>`}
function dashboard(){let act=kinds.flatMap(k=>data[k].map(r=>({...r,kind:k}))).sort((a,b)=>String(b._created||b.date||'').localeCompare(String(a._created||a.date||''))).slice(0,7);return head('Tableau de bord','Vue d’ensemble de la gestion de votre académie',`<button class="btn secondary" onclick="go('rapports')">Rapports</button><button class="btn" onclick="openForm('joueurs')">＋ Inscrire un joueur</button>`)+`<div class="hero"><div><h2>Le talent se cultive.<br>La victoire se construit.</h2><p>Bienvenue dans votre espace de gestion AFM.</p><button class="lightbtn" onclick="openForm('joueurs')">＋ Ajouter un joueur</button></div></div><div class="cards"><div class="card"><span class="symbol">♙</span><div class="statlabel">Joueurs actifs</div><div class="statnum">${data.joueurs.length}</div><div class="statfoot">Toutes les catégories</div></div><div class="card"><span class="symbol">▣</span><div class="statlabel">Cotisations encaissées</div><div class="statnum positive">${money(sum('cotisations'))}</div><div class="statfoot">Total enregistré</div></div><div class="card"><span class="symbol">↗</span><div class="statlabel">Dépenses + salaires + primes</div><div class="statnum negative">${money(sum('depenses')+sum('salaires')+sum('primes'))}</div><div class="statfoot">Total enregistré</div></div><div class="card"><span class="symbol">▤</span><div class="statlabel">Solde des opérations</div><div class="statnum">${money(solde())}</div><div class="statfoot">Cotisations + apports − sorties</div></div></div><div class="split"><div class="card panel"><h3>Situation financière</h3>${[['Cotisations',sum('cotisations'),'+'],['Approvisionnements de caisse',sum('apports'),'+'],['Dépenses',sum('depenses'),'-'],['Salaires',sum('salaires'),'-'],['Primes de match',sum('primes'),'-']].map(([n,v,sign])=>`<div class="rowline"><span>${n}</span><b class="${sign==='+'?'positive':'negative'}">${sign} ${money(v)}</b></div>`).join('')}<div class="rowline"><strong>Solde calculé</strong><strong>${money(solde())}</strong></div></div><div class="card panel"><h3>Catégories</h3>${['U13','U15','U17','U20'].map(c=>`<div class="rowline"><span class="pill">${c}</span><b>${data.joueurs.filter(r=>r.categorie===c).length} joueurs</b></div>`).join('')}</div></div><div class="split"><div class="card panel"><h3>Activités récentes</h3>${act.length?act.map(r=>`<div class="rowline"><span>${esc(navItems.find(i=>i[0]===r.kind)[2])} — ${esc(r.nom)}</span><small>${esc(r.date||r._created?.slice(0,10)||'')}</small></div>`).join(''):'<div class="hint">Aucune opération enregistrée.</div>'}</div><div class="card panel"><h3>Actions rapides</h3><div class="sectionlist"><button class="btn secondary" onclick="openForm('cotisations')">＋ Enregistrer une cotisation</button>${me.role==='president'?`<button class="btn secondary" onclick="openForm('apports')">＋ Approvisionner la caisse</button>`:''}<button class="btn secondary" onclick="openForm('depenses')">＋ Enregistrer une dépense</button><button class="btn secondary" onclick="go('import')">⇅ Sauvegarde / Export</button></div></div></div>`}
function tableView(k){let cfg=config[k],rows=data[k].filter(r=>Object.entries(r).some(([key,val])=>key!=='photo'&&typeof val==='string'&&val.toLowerCase().includes(filter.toLowerCase()))),fields=cfg.fields.filter(f=>f[2]!=='file');let canAdd=!(k==='apports'&&me.role!=='president');return head(navItems.find(i=>i[0]===k)[2],data[k].length+' enregistrement(s)',canAdd?`<button class="btn" onclick="openForm('${k}')">＋ Ajouter ${cfg.sing}</button>`:'<span class="pill">Réservé au président</span>')+`<div class="toolbar"><input id="tableSearch" placeholder="Rechercher..." value="${esc(filter)}" oninput="filter=this.value;tableRender('${k}')"><button class="btn secondary" onclick="exportCSV('${k}')">Exporter CSV</button></div><div class="tablewrap"><table class="tbl"><thead><tr>${cfg.fields.some(f=>f[0]==='photo')?'<th>Photo</th>':''}${fields.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr>${cfg.fields.some(f=>f[0]==='photo')?`<td>${r.photo?`<img class="thumb" src="${esc(r.photo)}" alt="Photo">`:'—'}</td>`:''}${fields.map(f=>`<td>${f[0]==='montant'?money(r[f[0]]):esc(r[f[0]]||'—')}</td>`).join('')}<td><div class="action-group">${canAdd?`<button class="mini" onclick="openForm('${k}','${r.id}')">Modifier</button>`:''}${(me.role==='president'||!['cotisations','apports','depenses','salaires','primes'].includes(k))?`<button class="mini red" onclick="removeItem('${k}','${r.id}')">Supprimer</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="${fields.length+2}" style="text-align:center;padding:32px;color:#9aa6b7">Aucun enregistrement.</td></tr>`}</tbody></table></div>`}
function tableRender(k){let pos=$('tableSearch')?.selectionStart;let v=$('tableSearch')?.value||'';filter=v;render();let e=$('tableSearch');if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch{}}}
function rapports(){return head('Rapports','Situation globale à partir des écritures enregistrées',`<button class="btn secondary" onclick="print()">Imprimer</button>`)+`<div class="cards"><div class="card"><div class="statlabel">Entrées</div><div class="statnum positive">${money(sum('cotisations')+sum('apports'))}</div></div><div class="card"><div class="statlabel">Sorties</div><div class="statnum negative">${money(sum('depenses')+sum('salaires')+sum('primes'))}</div></div><div class="card"><div class="statlabel">Solde</div><div class="statnum">${money(solde())}</div></div><div class="card"><div class="statlabel">Joueurs</div><div class="statnum">${data.joueurs.length}</div></div></div><div class="split"><div class="card panel"><h3>Mouvements</h3>${['cotisations','apports','depenses','salaires','primes'].map(k=>`<div class="rowline"><span>${esc(navItems.find(i=>i[0]===k)[2])}</span><b>${money(sum(k))}</b></div>`).join('')}</div><div class="card panel"><h3>Effectif par catégorie</h3>${['U13','U15','U17','U20'].map(c=>`<div class="rowline"><span>${c}</span><b>${data.joueurs.filter(x=>x.categorie===c).length}</b></div>`).join('')}</div></div><p class="notice">Ce solde correspond aux mouvements saisis dans AFM. Il ne constitue pas un rapprochement avec un compte bancaire.</p>`}
function imports(){return head('Import / Export','Sauvegarde et transfert de vos données')+`<div class="split"><div class="card panel"><h3>Sauvegarde complète</h3><p>Télécharger les joueurs, le personnel et toutes les opérations au format JSON.</p>${me.role==='president'?`<button class="btn" onclick="backup()">Télécharger une sauvegarde</button>`:'<div class="notice">Seul le président peut faire une sauvegarde complète.</div>'}<p class="info">Conservez une copie du fichier sur un support sécurisé.</p></div><div class="card panel"><h3>Restaurer une sauvegarde</h3><p>Attention : la restauration remplace toutes les données actuelles.</p>${me.role==='president'?`<button class="btn secondary" onclick="$('jsonfile').click()">Choisir un fichier JSON</button>`:'<div class="notice">Seul le président peut restaurer une sauvegarde.</div>'}</div></div><div class="notice">Import possible depuis la sauvegarde JSON de la précédente maquette AFM, après vérification. Aucune synchronisation automatique avec votre ancien site.</div>`}
function acces(){return head('Accès et paramètres','Sécurité et préférences')+`<div class="split"><div class="card panel"><h3>Apparence</h3><button class="btn secondary" onclick="document.body.classList.toggle('dark')">Basculer clair / sombre</button><p>Utilisateur actuel : <b>${esc(me.username)}</b></p></div><div class="card panel"><h3>Gestion des comptes</h3><p>Président : gestion et contrôle de toutes les rubriques, approvisionnements, suppressions financières et sauvegardes.</p><p>Gestionnaire : saisie des fiches, cotisations, dépenses, salaires et primes, sans approvisionnement ni suppression financière.</p>${me.role==='president'?`<button class="btn secondary" onclick="passwordDialog()">Modifier un mot de passe</button><button class="btn secondary" onclick="auditDialog()">Voir le journal d'audit</button>`:''}</div></div><div class="notice">Accès HTTPS réservé aux deux comptes AFM. Effectuez régulièrement des sauvegardes et protégez vos mots de passe.</div>`}
function render(){$('view').innerHTML=current==='dashboard'?dashboard():config[current]?tableView(current):current==='rapports'?rapports():current==='import'?imports():acces()}
function closeModal(){$('modalhost').innerHTML=''}
async function openForm(k,id){if(k==='apports'&&me.role!=='president'){toast('Réservé au président');return}let r=id?data[k].find(x=>x.id===id):null;let f=config[k].fields.map(([key,label,type,required,options])=>`<div class="field ${key==='note'?'wide':''}"><label>${esc(label)}</label>${type==='select'?`<select name="${key}" ${required?'required':''}><option value="">Sélectionner</option>${options.map(o=>`<option value="${o}" ${r?.[key]===o?'selected':''}>${o}</option>`).join('')}</select>`:type==='file'?`<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>Image de moins de 350 Ko</small>`:`<input name="${key}" type="${type}" ${required?'required':''} ${type==='number'?'step="1" min="1"':''} value="${esc(r?.[key]??(type==='date'?today():''))}">`}</div>`).join('');$('modalhost').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${id?'Modifier':'Ajouter'} ${config[k].sing}</h2><form id="entryform"><div class="formgrid">${f}</div><div class="modalfooter"><button class="btn secondary" type="button" onclick="closeModal()">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></form></div></div>`;$('entryform').onsubmit=async e=>{e.preventDefault();let vals=Object.fromEntries(new FormData(e.target));let file=vals.photo;delete vals.photo;if(file?.size){if(file.size>350000){toast('Photo trop volumineuse (max 350 Ko)');return}vals.photo=await new Promise((resolve,reject)=>{let fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}else if(r?.photo)vals.photo=r.photo;if('montant'in vals)vals.montant=Number(vals.montant);try{await api('records',{kind:k,id:id||undefined,data:vals});await refresh();closeModal();render();toast('Enregistrement effectué')}catch(x){toast(x.message)}}}
async function removeItem(k,id){if(!confirm('Supprimer définitivement cet enregistrement ?'))return;try{await api('delete',{kind:k,id});await refresh();render();toast('Suppression effectuée')}catch(x){toast(x.message)}}
function download(name,body,type){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function backup(){try{let d=await api('backup');download('AFM_sauvegarde_'+today()+'.json',JSON.stringify(d,null,2),'application/json')}catch(x){toast(x.message)}}
function exportCSV(k){let fields=config[k].fields.filter(f=>f[2]!=='file');let rows=[fields.map(f=>f[1]),...data[k].map(r=>fields.map(f=>r[f[0]]||''))];download('AFM_'+k+'_'+today()+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function passwordDialog(){$('modalhost').innerHTML=`<div class="modalwrap"><div class="modal"><h2>Modifier un mot de passe</h2><form id="passform"><div class="field"><label>Compte</label><select name="username"><option value="president">Président</option><option value="gestionnaire">Gestionnaire</option></select></div><div class="field"><label>Nouveau mot de passe (12 caractères minimum)</label><input type="password" name="password" minlength="12" required></div><p class="info">Tous les utilisateurs seront déconnectés.</p><div class="modalfooter"><button type="button" class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn">Enregistrer</button></div></form></div></div>`;$('passform').onsubmit=async e=>{e.preventDefault();try{await api('password',Object.fromEntries(new FormData(e.target)));closeModal();showLogin();toast('Mot de passe modifié, reconnectez-vous')}catch(x){toast(x.message)}}}
async function auditDialog(){try{let d=await api('audit');$('modalhost').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Journal d'audit</h2><div style="max-height:65vh;overflow:auto">${d.events.map(x=>`<div class="rowline"><span>${esc(x.action)} ${esc(x.kind||'')}<br><small>${esc(x.actor)}</small></span><small>${esc(x.moment.replace('T',' ').slice(0,19))}</small></div>`).join('')||'Aucun événement'}</div><div class="modalfooter"><button class="btn secondary" onclick="closeModal()">Fermer</button></div></div></div>`}catch(x){toast(x.message)}}
$('jsonfile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.records||!kinds.every(k=>Array.isArray(v.records[k])))throw Error('Fichier JSON incompatible');let n=kinds.reduce((a,k)=>a+v.records[k].length,0);if(!confirm(`Restaurer ${n} enregistrements ? Toutes les données actuelles seront remplacées. Faites une sauvegarde avant !`))return;await api('import',{records:v.records});await refresh();render();toast('Restauration terminée')}catch(x){toast(x.message)}finally{e.target.value=''}};
init();
</script></body></html>
